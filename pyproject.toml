[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsalpha"
version = "0.1.0"
description = "STTM reproduction: news-based stock movement prediction (PeerJ CS 2022)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "gensim>=4.3.3",
    "statsmodels>=0.14",
    "pyyaml>=6.0",
    "pymystem3>=0.2",
    "nltk>=3.8",
    "razdel>=0.5",
    "natasha>=1.6",
    "corus>=0.9",
    "quantstats>=0.0.6",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pyarrow>=14.0",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
